<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Dish - FoodieHub</title>

    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Google Font -->
    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
            url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1600&auto=format&fit=crop');

            background-size:cover;
            background-position:center;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:30px;
        }

        .dish-card{

            width:100%;
            max-width:550px;

            background:rgba(255,255,255,0.96);

            border-radius:25px;

            overflow:hidden;

            box-shadow:0 12px 35px rgba(0,0,0,0.35);

            animation:fadeIn 0.5s ease;
        }

        .top-section{

            background:#e23744;

            padding:28px;

            text-align:center;

            color:white;
        }

        .top-section h1{

            font-size:2.4rem;
            font-weight:700;
            margin-bottom:8px;
        }

        .top-section p{

            margin:0;
            opacity:0.9;
        }

        .form-section{

            padding:35px;
        }

        .form-label{

            font-weight:600;
            color:#333;
            margin-bottom:8px;
        }

        .form-control{

            height:54px;

            border-radius:12px;

            border:1px solid #ddd;

            padding-left:15px;

            transition:0.3s;
        }

        .form-control:focus{

            border-color:#e23744;

            box-shadow:none;
        }

        .btn-custom{

            height:52px;

            border-radius:12px;

            font-weight:600;

            transition:0.3s;
        }

        .btn-add{

            background:#e23744;
            border:none;
            color:white;
        }

        .btn-add:hover{

            background:#c82333;
            transform:translateY(-2px);
        }

        .btn-back:hover{

            transform:translateY(-2px);
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:576px){

            .top-section h1{

                font-size:2rem;
            }

            .form-section{

                padding:25px;
            }
        }

    </style>

</head>

<body>

    <div class="dish-card">

        <!-- Header -->

        <div class="top-section">

            <h1>FoodieHub</h1>

            <p>Add Delicious Dishes To Your Menu</p>

        </div>

        <!-- Form -->

        <div class="form-section">

            <h3 class="text-center fw-bold mb-4">
                Add Dish
            </h3>

            <form action="addDish" method="post">

                <!-- Dish Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Dish Name
                    </label>

                    <input
                    type="text"
                    class="form-control"
                    placeholder="Enter dish name"
                    name="dishName">


                </div>

                <!-- Dish ID -->

                <div class="mb-3">

                    <label class="form-label">
                        Dish ID
                    </label>

                    <input
                    type="text"
                    class="form-control"
                    placeholder="Enter dish ID"
                    name="dishId">

                </div>

                <!-- Dish Price -->

                <div class="mb-4">

                    <label class="form-label">
                        Dish Price
                    </label>

                    <input
                    type="number"
                    class="form-control"
                    placeholder="Enter dish price"
                    name="dishPrice">

                </div>

                <!-- Buttons -->

                <div class="d-flex gap-3">

                    <button
                    type="button"
                    class="btn btn-outline-danger btn-custom btn-back w-50"
                    onclick="history.back()">

                    ← Back

                    </button>

                    <button
                    type="submit"
                    class="btn btn-custom btn-add w-50">

                    Add Dish

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Bootstrap JS -->

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
