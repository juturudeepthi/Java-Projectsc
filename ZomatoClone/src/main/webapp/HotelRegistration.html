<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hotel Registration - FoodieHub</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
    }

    .register-card{
      width:100%;
      max-width:550px;
      background:rgba(255,255,255,0.96);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 40px rgba(0,0,0,0.35);
      animation:fadeIn 0.5s ease;
    }

    .top-banner{
      background:#e23744;
      color:white;
      text-align:center;
      padding:25px;
    }

    .top-banner h1{
      font-size:2.2rem;
      font-weight:700;
      margin-bottom:8px;
    }

    .top-banner p{
      margin:0;
      font-size:0.95rem;
      opacity:0.9;
    }

    .form-section{
      padding:35px;
    }

    .form-label{
      font-weight:600;
      color:#444;
      margin-bottom:8px;
    }

    .form-control{
      height:52px;
      border-radius:12px;
      border:1px solid #ddd;
      padding-left:15px;
      transition:0.3s;
    }

    .form-control:focus{
      border-color:#e23744;
      box-shadow:none;
    }

    .btn-register{
      background:#e23744;
      border:none;
      height:52px;
      border-radius:12px;
      font-weight:600;
      font-size:1rem;
      transition:0.3s;
    }

    .btn-register:hover{
      background:#c82333;
      transform:translateY(-2px);
    }

    .btn-back{
      height:52px;
      border-radius:12px;
      font-weight:600;
      transition:0.3s;
    }

    .btn-back:hover{
      transform:translateY(-2px);
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:576px){

      .top-banner h1{
        font-size:1.8rem;
      }

      .form-section{
        padding:25px;
      }
    }
  </style>
</head>

<body>

  <div class="register-card">

    <!-- Header -->
    <div class="top-banner">
      <h1>FoodieHub</h1>
      <p>Become a Restaurant Partner Today</p>
    </div>

    <!-- Form -->
    <div class="form-section">

      <h3 class="text-center fw-bold mb-4">
        Hotel Registration
      </h3>

      <form action="HotelRegistration" method="post">

        <!-- Hotel Name -->
        <div class="mb-3">
          <label class="form-label">Hotel Name</label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter hotel name"
            name="hotelName"
          />
        </div>

        <!-- Hotel Address -->
        <div class="mb-3">
          <label class="form-label">Hotel Address</label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter hotel address"
            name="hotelAddress"
          />
        </div>

        <!-- Hotel ID -->
        <div class="mb-3">
          <label class="form-label">Hotel ID</label>
          <input
            type="text"
            class="form-control"
            placeholder="Create hotel ID"
            name="hotelId"
          />
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            placeholder="Create password"
            name="hotelPassword"
          />
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-3">

          <button
            type="button"
            class="btn btn-outline-danger btn-back w-50"
            onclick="history.back()"
          >
            ← Back
          </button>

          <button
            type="submit"
            class="btn btn-danger btn-register w-50"
          >
            Register
          </button>

        </div>

      </form>

    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
